name: Dependency audit coverage

on:
  schedule:
    - cron: "11 6 * * 1"
  workflow_dispatch:

concurrency:
  group: dependency-audit-coverage-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  coverage:
    name: Dependency audit coverage
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check public repositories
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync-dependency-audit.py --check --org hraness --visibility public --include-forks | tee -a "$GITHUB_STEP_SUMMARY"
