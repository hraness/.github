name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Workflow lint
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint" -color'

  test:
    name: Script tests
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Browser template self-test
        run: node templates/verify-public-site-browser.mjs --self-test
      - name: Cost lint of this repository
        run: python3 scripts/ci-cost-lint.py . --visibility private

  Required:
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Every blocking job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "A blocking job finished with: $result"
              exit 1
            fi
          done
