# Weekly report of public repositories whose AGENTS.md blocks differ from the
# canonical hraness-* blocks in this repository. Report-only: it never writes
# to another repository. The job token cannot read private repositories; check
# those from a signed-in machine with
#   scripts/sync-agent-blocks.py --check --org hraness --visibility private
name: Agent block drift

on:
  schedule:
    - cron: "23 14 * * 1"
  workflow_dispatch:

concurrency:
  group: agent-block-drift-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  drift:
    name: Agent block drift
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check public repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync-agent-blocks.py --check --org hraness --visibility public | tee -a "$GITHUB_STEP_SUMMARY"
