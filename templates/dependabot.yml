# Hraness Dependabot template. Copy to .github/dependabot.yml and delete the
# ecosystems the repository does not use. Every ecosystem runs once a week at
# the same time, so an update wave lands as one grouped pull request per
# ecosystem instead of one pull request (and one full CI run) per package.
#
# open-pull-requests-limit: 2 for public repositories, whose CI minutes are
# free. Set it to 1 in private repositories: every Dependabot pull request
# runs billed CI again each time main moves.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"

  # Bun repositories (bun.lock). Use `bun`, not `npm`: npm updates fail on
  # bun.lock.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    groups:
      bun-minor-patch:
        update-types:
          - minor
          - patch

  # Rust repositories (Cargo.lock).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
